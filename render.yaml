services:
  - type: web
    name: travel-north-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/status
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ANALYTICS_BASE_URL
        fromService:
          type: web
          name: travel-north-analytics
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ALLOWED_ORIGIN
        value: http://localhost:5173
      - key: SPRING_JPA_SHOW_SQL
        value: "false"

  - type: web
    name: travel-north-analytics
    runtime: python
    plan: free
    region: oregon
    rootDir: analytics-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn microservicio:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: travel-north-api
          envVarKey: RENDER_EXTERNAL_URL
